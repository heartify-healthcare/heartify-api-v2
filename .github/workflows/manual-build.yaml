name: Manual Build & Push Service

on:
  push:
    branches: [ "feat/dockerfile", "develop", "main" ]
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Select Service to Build'
        required: true
        default: 'api-gateway'
        type: choice
        options:
          - api-gateway
          - config-server
          - eureka-server
          - user-service
          - ai-service
          - ALL_SERVICES
      push_latest:
        description: 'Tag as latest?'
        required: true
        type: boolean
        default: true

env:
  AWS_REGION: ap-southeast-1

jobs:
  # ====================================================
  # JOB 1: CHUẨN BỊ MATRIX (Đã Fix lỗi cú pháp JSON)
  # ====================================================
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.service_name }}" == "ALL_SERVICES" ]; then
            # JSON Array chuẩn cho tất cả service
            echo 'matrix=["api-gateway","config-server","eureka-server","user-service","ai-service"]' >> $GITHUB_OUTPUT
          else
            # JSON Array chuẩn cho 1 service (Lưu ý dấu ngoặc kép được escape kỹ)
            echo "matrix=[\"${{ inputs.service_name }}\"]" >> $GITHUB_OUTPUT
          fi
      
      # [DEBUG] In ra để kiểm tra xem biến có giá trị không
      - name: Debug Matrix Output
        run: echo "Generated Matrix: ${{ steps.set-matrix.outputs.matrix }}"

  # ====================================================
  # JOB 2: BUILD & PUSH
  # ====================================================
  manual-build:
    needs: setup-matrix
    runs-on: ubuntu-latest
    # Thêm check: Chỉ chạy khi matrix không rỗng
    if: ${{ needs.setup-matrix.outputs.matrix != '' && needs.setup-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # [DEBUG] Kiểm tra tên service trước khi build
      - name: Debug Service Name
        run: |
          echo "Current Service: ${{ matrix.service }}"
          if [ -z "${{ matrix.service }}" ]; then
            echo "❌ ERROR: Service name is empty!"
            exit 1
          fi

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Sửa lại reference để đảm bảo không bị lỗi cú pháp bash
          ECR_REPOSITORY: heartify/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Chuyển vào thư mục service
          cd ${{ matrix.service }}
          
          echo "🚀 Starting manual build for: ${{ matrix.service }}..."
          echo "Target Repo: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          # Build
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push SHA Tag
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Push Latest Tag (nếu được chọn)
          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            echo "🏷️ Tagging and pushing 'latest'..."
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          fi