name: Backend Microservices CI/CD

on:
  push:
    branches: [ "feat/dockerfile", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:
    # THÊM: Input để tùy chọn force build
    inputs:
      force_build_all:
        description: 'Force build ALL services (Ignore changes)?'
        required: true
        default: false
        type: boolean

env:
  AWS_REGION: ap-southeast-1

jobs:
  # ====================================================
  # JOB 1: DETECT CHANGES HOẶC SET ALL
  # ====================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Output cuối cùng sẽ được quyết định ở bước "Determine Final Matrix"
      matrix: ${{ steps.final-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      # Bước 1: Vẫn chạy detect changes như bình thường
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          json: true
          escape_json: false
          files_yaml: |
            api-gateway: 
              - api-gateway/**
            config-server: 
              - config-server/**
            eureka-server: 
              - eureka-server/**
            user-service: 
              - user-service/**
            ai-service: 
              - ai-service/**

      # Bước 2: Quyết định Matrix cuối cùng
      - name: Determine Final Matrix
        id: final-matrix
        run: |
          # Kiểm tra xem người dùng có chọn Force Build không
          if [[ "${{ inputs.force_build_all }}" == "true" ]]; then
            echo "🚀 FORCE BUILD DETECTED: Building ALL services..."
            # Gán cứng danh sách tất cả service vào đây (JSON Array chuẩn)
            echo 'matrix=["api-gateway","config-server","eureka-server","user-service","ai-service"]' >> $GITHUB_OUTPUT
          
          else
            echo "🔍 Standard Change Detection Mode..."
            CHANGED_KEYS='${{ steps.changed-files.outputs.changed_keys }}'
            
            # Nếu không có thay đổi nào, tj-actions có thể trả về rỗng, ta gán là mảng rỗng []
            if [[ -z "$CHANGED_KEYS" || "$CHANGED_KEYS" == "null" ]]; then
              echo "matrix=[]" >> $GITHUB_OUTPUT
            else
              echo "matrix=$CHANGED_KEYS" >> $GITHUB_OUTPUT
            fi
          fi

  # ====================================================
  # JOB 2: BUILD & PUSH
  # ====================================================
  build-and-deploy:
    needs: changes
    runs-on: ubuntu-latest
    # Chỉ chạy nếu matrix không rỗng (tránh lỗi cú pháp JSON)
    if: ${{ needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }} # Dùng secrets.AWS_REGION cho đồng bộ (hoặc env.AWS_REGION tùy setup của bạn)

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: heartify/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd ${{ matrix.service }}
          echo "Building service: ${{ matrix.service }}..."
          
          # Build
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push SHA Tag
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Push Latest Tag (Chỉ áp dụng cho nhánh main)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Tagging latest..."
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          fi