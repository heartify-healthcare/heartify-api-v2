name: Backend Microservices CI/CD

on:
  push:
    branches: [ "feat/dockerfile", "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch: 
    # Giữ lại để bạn có thể bấm chạy thủ công nếu muốn

env:
  AWS_REGION: ap-southeast-1

jobs:
  # ====================================================
  # BUILD & PUSH ALL SERVICES
  # (Không check thay đổi, luôn chạy hết danh sách)
  # ====================================================
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Gán cứng danh sách tất cả các service tại đây
        service: [api-gateway, config-server, eureka-server, user-service, ai-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: heartify/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd ${{ matrix.service }}
          echo "🚀 Building service: ${{ matrix.service }}..."
          
          # Build
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push SHA Tag (Commit ID)
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Push Latest Tag (Chỉ áp dụng cho nhánh main)
          # if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "🏷️ Tagging latest..."
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          # fi