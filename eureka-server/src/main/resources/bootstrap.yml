spring:
  application:
    name: eureka-server
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      username: ${CONFIG_SERVER_USERNAME:heartify}
      password: ${CONFIG_SERVER_PASSWORD:heartify}
      fail-fast: false
      retry:
        max-attempts: 10
        initial-interval: 1000
        max-interval: 10000
